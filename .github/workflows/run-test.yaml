name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector passed to tox posargs; empty runs the full suite"
        required: false
        default: ""
        type: string

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

        include:
          # no arm64 CPython 3.7 build exists; run the x64 interpreter under Rosetta
          - os: "macos-latest"
            python-version: "3.7"
            architecture: "x64"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        if: matrix.architecture != 'x64'
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      # the actions/python-versions x64 3.7 build links x86 homebrew gettext,
      # absent on arm64 runners; python.org's framework installer is self-contained
      - name: Set up python (x64 CPython 3.7 under Rosetta)
        if: matrix.architecture == 'x64'
        shell: bash
        run: |
          curl -sSfLo python.pkg https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg python.pkg -target /
          rm python.pkg
          FW=/Library/Frameworks/Python.framework/Versions/3.7/bin
          mkdir -p "$HOME/py37bin"
          ln -s "$FW/python3" "$HOME/py37bin/python"
          ln -s "$FW/pip3" "$HOME/py37bin/pip"
          echo "$HOME/py37bin" >> "$GITHUB_PATH"
          echo "$FW" >> "$GITHUB_PATH"
          "$HOME/py37bin/python" -c "import sys, platform; print(sys.version, platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          pip list

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        env:
          PIP_INDEX_URL: "https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/"
        run: |
          # release builds drop the setup.cfg "tag_build = dev" egg_info tag
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          python -m pip install build "wheel==0.38.4"
          python -m build

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Run tests
        run: tox -- ${{ inputs.test-filter }}
